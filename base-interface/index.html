<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Interface — Slide Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <header class="header">
        <!-- Component 1: back + title bài -->
        <div class="header-left">
            <button class="icon-btn" id="backBtn" aria-label="Quay lại">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <path d="M16 10H4m0 0 5-5m-5 5 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button class="icon-btn sidebar-reopen" id="sidebarReopenBtn" aria-label="Mở mục lục" hidden>
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
            </button>
            <h1 class="lesson-title" id="lessonTitle">Bài 4 · Day 17 — Product Discovery: Finding and Validating Pain Points</h1>
        </div>

        <div class="header-right">
            <!-- Component 2: thanh tiến trình -->
            <div class="progress" id="progress">
                <span class="progress-label" id="progressLabel">0/10 bài</span>
                <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBar">
                    <div class="progress-fill"></div>
                </div>
            </div>

            <span class="header-divider" aria-hidden="true"></span>

            <!-- Component 3: chatbot + user -->
            <button class="icon-btn accent" id="chatbotBtn" aria-label="Mở trợ lý AI">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <path d="M10 2.5l1.4 3.6L15 7.5l-3.6 1.4L10 12.5 8.6 8.9 5 7.5l3.6-1.4L10 2.5Z" fill="currentColor"/>
                    <path d="M15.2 12.4l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8Z" fill="currentColor"/>
                </svg>
            </button>
            <button class="avatar" id="userBtn" aria-label="Tài khoản: Cao Các Tường">C</button>
        </div>
    </header>

    <div class="workspace" id="workspace">
        <!-- ==================== LEFT PANEL — đề mục slide ==================== -->
        <aside class="sidebar" id="sidebar" aria-label="Mục lục bài học">
            <div class="sidebar-head">
                <h2 class="sidebar-title">Nội dung bài học</h2>
                <button class="icon-btn sm" id="sidebarCloseBtn" aria-label="Đóng mục lục">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                        <path d="M4.5 4.5l9 9m0-9-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <nav class="outline" id="outline"><!-- render bởi script.js --></nav>
        </aside>
        <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

        <!-- ==================== RIGHT PANEL — render slide ==================== -->
        <main class="viewer">
            <div class="viewer-toolbar">
                <button class="icon-btn accent round" id="noteBtn" aria-label="Ghi chú">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                        <path d="M12.2 2.8a1.7 1.7 0 0 1 2.4 2.4L6.9 12.9l-3 .8.8-3 7.5-7.9Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <div class="pager">
                    <button class="pager-btn" id="prevBtn" aria-label="Slide trước">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                            <path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <label class="pager-label" for="pageInput">Slide</label>
                    <input class="pager-input" id="pageInput" type="text" inputmode="numeric" value="1" aria-label="Số trang slide">
                    <span class="pager-total">/ <span id="pageTotal">1</span></span>
                    <button class="pager-btn" id="nextBtn" aria-label="Slide sau">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                            <path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="stage-wrap">
                <div class="stage" id="stage">
                    <button class="stage-ai" id="stageAiBtn" aria-label="Hỏi AI về slide này">
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                            <path d="M10 2.5l1.4 3.6L15 7.5l-3.6 1.4L10 12.5 8.6 8.9 5 7.5l3.6-1.4L10 2.5Z" fill="currentColor"/>
                        </svg>
                    </button>

                    <iframe class="slide-frame" id="slideFrame" title="Nội dung slide" hidden></iframe>

                    <div class="stage-empty" id="stageEmpty">
                        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M6 3h7l5 5v13H6V3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                            <path d="M13 3v5h5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                        </svg>
                        <p class="stage-empty-title">Chưa gắn file PDF</p>
                        <p class="stage-empty-hint">Đặt <code>pdfUrl</code> cho slide này trong <code>script.js</code> để render.</p>
                    </div>
                </div>
                <p class="stage-caption" id="stageCaption"></p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
